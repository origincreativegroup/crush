[package]
name = "crush-app"
version.workspace = true
description = "Crush local video search desktop application"
license.workspace = true
repository.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "crush_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
crush-core = { path = "../../core" }
crush-store = { path = "../../store" }
crush-stage-split = { path = "../../stage-split" }
crush-stage-embed = { path = "../../stage-embed" }
crush-pipeline = { path = "../../pipeline" }
crush-search = { path = "../../search" }

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "=2.11.3", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-dialog = "=2.7.2"

[target.'cfg(target_os = "macos")'.build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dev-dependencies]
tempfile = "=3.27.0"
