<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Crush UI harness</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0d1117;
      }
      /* Same logical size as the shipped Tauri window (1100x720 minimum). */
      #app-frame {
        border: 0;
        width: 1100px;
        height: 720px;
        display: block;
      }
    </style>
  </head>
  <body>
    <iframe id="app-frame" title="Crush app under test"></iframe>
    <script>
      // The real app runs unmodified inside the iframe; there is no duplicated DOM here.
      // scripts/ui-harness.mjs injects crates/app/tests/mock-bridge.js via addInitScript so
      // the mock bridge exists inside the iframe before app.js and search.js parse. The
      // scenario rides on the iframe URL so mock-bridge.js can read window.location.search.
      const scenario = new URLSearchParams(window.location.search).get("scenario") || "empty";
      document
        .getElementById("app-frame")
        .setAttribute("src", `../ui/index.html?scenario=${encodeURIComponent(scenario)}`);
    </script>
  </body>
</html>
