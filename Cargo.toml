[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/store",
  "crates/stage-split",
  "crates/stage-embed",
  "crates/stage-asr",
  "crates/search",
  "crates/cli",
]
# spike/ is intentionally NOT a workspace member. It is throwaway (Task 0).

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/origincreativegroup/crush"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
# Pinned later by Task 0 outcome — do NOT add here yet:
#   ort, whisper-rs, rusqlite, tauri
