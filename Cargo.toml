[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/store",
  "crates/stage-split",
  "crates/stage-embed",
  "crates/stage-asr",
  "crates/search",
  "crates/cli",
]
exclude = ["spike"]
# spike/ is intentionally NOT a workspace member. It is throwaway (Task 0).

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/origincreativegroup/crush"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
libc = "=0.2.189"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "pnm"] }
sha2 = "=0.11.0"
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }
ort = "=2.0.0-rc.13"
flate2 = "=1.1.9"
regex = "=1.12.3"
hound = "=3.5.1"
whisper-rs = "=0.16.0"
# Pinned later by its implementation task:
#   tauri
# Blacklisted (dead or wrong for this project):
#   onnxruntime-rs, ffmpeg-next, tch
