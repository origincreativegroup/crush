# Copy to crush.toml. All keys optional; these are the defaults.
# data_dir = "/Users/you/Library/Application Support/dev.crush.app"

[split]
sample_fps = 4.0
threshold = 27.0
min_scene_len_s = 0.6
rep_frame_pos = 0.4

[embed]
model = "clip-vit-b-32"
provider = "coreml"   # or "cpu"

[search]
transcript_hit_boost = 0.15

[asr]
model = "auto"        # auto: base below 12 GiB, otherwise small; may override with "base" or "small"
# language = "en"

[limits]
threads = 0           # 0 = physical cores minus two
concurrent_videos = 1

[ai]
provider = "none"     # "none" (default) keeps AI description off — describe returns an honest
                      # capability error and nothing else in Crush is affected. "ollama" enables
                      # local vision description via Ollama on your network.
ollama_host = "http://192.168.50.247:11434"   # ai-srv. Configured explicitly, never auto-discovered.
ollama_model = "llava"
temperature = 0.3     # nodeo's tuned finding: low temperature for consistent JSON output
max_tokens = 300      # covers the single-call structured JSON response
max_concurrent = 2    # bounded so a describe batch never saturates the one Ollama host
