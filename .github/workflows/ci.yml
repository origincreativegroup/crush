name: ci
on: [push, pull_request]
jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
  test-macos-accelerated:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure model cache path
        run: |
          echo "CRUSH_TEST_MODELS=$RUNNER_TEMP/crush-models-v1" >> "$GITHUB_ENV"
          echo "CRUSH_TEST_SIDECARS=$RUNNER_TEMP/crush-sidecars-v1" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/crush-sidecars-v1" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/crush-models-v1
          key: crush-models-v1-asr-1be3a9b2063867b9
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/crush-sidecars-v1
          key: crush-sidecars-v1-73a2114706389cad
      - name: Download pinned CLIP model assets
        run: |
          mkdir -p "$CRUSH_TEST_MODELS"
          test -f "$CRUSH_TEST_MODELS/clip-image.onnx" || curl --fail --location --retry 4 --output "$CRUSH_TEST_MODELS/clip-image.onnx" https://github.com/origincreativegroup/crush/releases/download/models-v1/clip-image.onnx
          test -f "$CRUSH_TEST_MODELS/clip-text.onnx" || curl --fail --location --retry 4 --output "$CRUSH_TEST_MODELS/clip-text.onnx" https://github.com/origincreativegroup/crush/releases/download/models-v1/clip-text.onnx
          test -f "$CRUSH_TEST_MODELS/bpe_simple_vocab_16e6.txt.gz" || curl --fail --location --retry 4 --output "$CRUSH_TEST_MODELS/bpe_simple_vocab_16e6.txt.gz" https://github.com/origincreativegroup/crush/releases/download/models-v1/bpe_simple_vocab_16e6.txt.gz
          test -f "$CRUSH_TEST_MODELS/ggml-small.bin" || curl --fail --location --retry 4 --output "$CRUSH_TEST_MODELS/ggml-small.bin" https://github.com/origincreativegroup/crush/releases/download/models-v1/ggml-small.bin
      - name: Verify pinned model hashes
        run: |
          test "$(shasum -a 256 "$CRUSH_TEST_MODELS/clip-image.onnx" | cut -d ' ' -f 1)" = "9a4c3b87ec5c78e3951b6e7e041981e55468efe8978ec5411b00510ae8726d01"
          test "$(shasum -a 256 "$CRUSH_TEST_MODELS/clip-text.onnx" | cut -d ' ' -f 1)" = "cab3f1bb08bcb3a46e033c69b43015ba49c1308a3b7ff24bce61e08a41e476d8"
          test "$(shasum -a 256 "$CRUSH_TEST_MODELS/bpe_simple_vocab_16e6.txt.gz" | cut -d ' ' -f 1)" = "924691ac288e54409236115652ad4aa250f48203de50a9e4722a6ecd48d6804a"
          test "$(shasum -a 256 "$CRUSH_TEST_MODELS/ggml-small.bin" | cut -d ' ' -f 1)" = "1be3a9b2063867b937e64e2ec7483364a79917e157fa98c5d94b5c1fffea987b"
      - name: Download and verify pinned FFmpeg sidecars
        run: |
          mkdir -p "$CRUSH_TEST_SIDECARS"
          test -f "$CRUSH_TEST_SIDECARS/ffmpeg" || curl --fail --location --retry 4 --output "$CRUSH_TEST_SIDECARS/ffmpeg" https://github.com/origincreativegroup/crush/releases/download/sidecars-v1/ffmpeg
          test -f "$CRUSH_TEST_SIDECARS/ffprobe" || curl --fail --location --retry 4 --output "$CRUSH_TEST_SIDECARS/ffprobe" https://github.com/origincreativegroup/crush/releases/download/sidecars-v1/ffprobe
          test "$(shasum -a 256 "$CRUSH_TEST_SIDECARS/ffmpeg" | cut -d ' ' -f 1)" = "73a2114706389cad8a87890bb77b0dbe2031647acf25d6dcf48baf32fae29d0d"
          test "$(shasum -a 256 "$CRUSH_TEST_SIDECARS/ffprobe" | cut -d ' ' -f 1)" = "da8681f30f30c6b344a2e40899b5c5669d0e501712c1867305a5027b3d6380d8"
          chmod +x "$CRUSH_TEST_SIDECARS/ffmpeg" "$CRUSH_TEST_SIDECARS/ffprobe"
          mkdir -p sidecars
          cp "$CRUSH_TEST_SIDECARS/ffmpeg" sidecars/ffmpeg-aarch64-apple-darwin
          cp "$CRUSH_TEST_SIDECARS/ffprobe" sidecars/ffprobe-aarch64-apple-darwin
      - run: cargo check -p crush-app
      - run: cargo test -p crush-stage-embed --test embedding_goldens clip_token_ids_match_all_text_goldens -- --nocapture
      - run: cargo test -p crush-stage-embed --test embedding_goldens cpu_image_and_text_embeddings_match_goldens -- --nocapture
      - run: cargo test -p crush-cli --test search_fixtures -- --nocapture
      - run: cargo test -p crush-stage-asr --test transcription_goldens -- --nocapture
      - run: cargo test -p crush-pipeline --test ingest_fixtures -- --nocapture
      - run: cargo test -p crush-pipeline --test source_fidelity -- --nocapture
